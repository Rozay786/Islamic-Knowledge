<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:#0f1724; color:#e6f0f6; display:flex; flex-direction:column; height:100vh; }

  header { background: rgba(30,41,59,0.9); padding:16px; text-align:center; }
  header h1 { font-size:1.8rem; }
  header p { font-size:1rem; color:#a0aec0; margin-top:4px; }

  .tabs { display:flex; overflow-x:auto; background:#1e293b; }
  .tab { padding:12px 24px; cursor:pointer; color:#cbd5e1; font-weight:500; transition:0.3s; white-space:nowrap; }
  .tab:hover { background:#3b82f6; color:#fff; }
  .tab.active { background:#3b82f6; color:#fff; }

  .tab-content { flex:1; position:relative; overflow:hidden; }
  .tab-pane { display:none; width:100%; height:calc(100vh - 120px); position:absolute; top:0; left:0; }
  .tab-pane.active { display:block; }
  widgetbot { width:100%; height:100%; }

  footer { background: rgba(30,41,59,0.9); padding:8px; text-align:center; font-size:0.85rem; color:#9aa4b2; }
</style>
</head>
<body>

<header>
  <h1>Your Discord Community</h1>
  <p>Read-only view of your server</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="tab-content" id="tab-content"></div>
<footer>
  Visitors cannot join or send messages in the Discord server.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed"></script>
<script>
const serverId = "1326450375422775388";

// Example categories and channels
// Replace or expand these with your real channel IDs
const categories = [
  { name: "General", channels: ["GENERAL_CHANNEL_ID_1","GENERAL_CHANNEL_ID_2"] },
  { name: "Gaming", channels: ["GAMING_CHANNEL_ID_1","GAMING_CHANNEL_ID_2"] },
  { name: "Voice", channels: ["VOICE_CHANNEL_ID_1"] }
];

function createTabs(categories) {
  const tabsContainer = document.getElementById("tabs");
  const contentContainer = document.getElementById("tab-content");

  categories.forEach((category, idx) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (idx === 0 ? " active" : "");
    tab.innerText = category.name;
    tab.dataset.tab = category.name;
    tabsContainer.appendChild(tab);

    const pane = document.createElement("div");
    pane.className = "tab-pane" + (idx === 0 ? " active" : "");
    pane.id = category.name;

    category.channels.forEach(ch => {
      const embed = document.createElement("widgetbot");
      embed.setAttribute("server", serverId);
      embed.setAttribute("channel", ch);
      pane.appendChild(embed);
    });

    contentContainer.appendChild(pane);

    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      pane.classList.add("active");
    });
  });
}

createTabs(categories);
</script>
</body>
</html>
